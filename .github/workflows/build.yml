# https://github.com/actions/runner-images#available-images
name: Build & Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  GCC-CLANG:
    name: "${{ matrix.os }}-${{ matrix.altname || matrix.cc }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++}
          - {os: ubuntu-22.04, cc: gcc, cxx: g++}
          - {os: ubuntu-22.04, cc: clang, cxx: clang++}
          - {os: macos-15, cc: clang, cxx: clang++}
          - {os: macos-14, cc: clang, cxx: clang++}
          - {os: windows-2025, cc: gcc, cxx: g++, altname: "mingw-gcc"}
          - {os: windows-2022, cc: gcc, cxx: g++, altname: "mingw-gcc"}
    env:
      MRUBY_CONFIG: ci/gcc-clang
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LD: ${{ matrix.cc }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v5
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Build and test
        run: rake -m test:run:serial

  Windows-VC:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      MRUBY_CONFIG: ci/msvc
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v5
      - name: Ruby version
        run: ruby -v
      - name: Build and test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rake -m test:run:serial

  Windows-ARM64-CLANG:
    runs-on: windows-11-arm
    timeout-minutes: 10
    env:
      MRUBY_CONFIG: ci/gcc-clang
      CC: 'clang'
      CXX: 'clang++'
      LD: 'clang'
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v5
      - name: Setup MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-toolchain
            make
            pkgconf
            mingw-w64-clang-aarch64-ruby
      - name: Ruby version
        shell: msys2 {0}
        run: ruby -v
      - name: Compiler version
        shell: msys2 {0}
        run: clang --version
      - name: Dump Predefined Macros
        shell: msys2 {0}
        run: |
          echo | clang -dM -E - | grep -E '__MINGW64__|__GNUC__|__aarch64__|_WIN64' || true
      - name: Build and test
        shell: msys2 {0}
        run: rake -m test:run:serial
